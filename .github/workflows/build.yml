name: build

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore FrankBr-Design-Studio.sln
      - name: Build
        run: dotnet build FrankBr-Design-Studio.sln --configuration Release --no-restore
